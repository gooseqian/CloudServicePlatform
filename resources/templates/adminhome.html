        function loadUserAvatar() {
            fetch('/api/user/avatar')
                .then(response => response.json())
                .then(data => {
                    if (data.avatarUrl) {
                        document.getElementById('nav-avatar').src = data.avatarUrl + '?' + new Date().getTime();
                    }
                })
                .catch(error => {
                    console.error('加载头像失败:', error);
                });
        }
        
        // 页面加载完成后加载头像
        window.addEventListener('DOMContentLoaded', loadUserAvatar);
    </script>

<script>
function logout() {
    if (confirm('确定要退出登录吗？')) {
        // 发送退出登录请求 - 使用Spring Security默认的登出路径
        fetch('/logout', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            }
        })
        .then(response => {
            if (response.ok) {
                // 退出成功，跳转到登录页面
                window.location.href = '/login?logout=true';
            } else {
                alert('退出登录失败，请重试');
            }
        })
        .catch(error => {
            console.error('退出登录错误:', error);
            alert('退出登录失败，请重试');
        });
    }
}

function loadContent(contentType) {
    // 获取内容区域
    const contentArea = document.getElementById('content-area');
    
    // 显示加载中状态
    contentArea.innerHTML = '<div class="text-center py-12"><div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-primary border-t-transparent"></div><p class="mt-4 text-gray-600">加载中...</p></div>';
    
    // 根据类型加载不同的HTML文件
    let url = '';
    if (contentType === 'mypurchases') {
        url = 'mypurchases';
    } else if (contentType === 'myorder') {
        url = 'myorder';
    }
    
    // 发起AJAX请求加载内容
    fetch(url)
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            return response.text();
        })
        .then(htmlContent => {
            // 将加载的HTML内容放入内容区域
            contentArea.innerHTML = htmlContent || '<div class="text-center py-12"><p class="text-gray-600">暂无内容</p></div>';
            // 更新活动菜单状态
            updateActiveMenu(contentType);
        })
        .catch(error => {
            console.error('Error loading content:', error);
            contentArea.innerHTML = '<div class="text-center py-12"><p class="text-red-600">加载失败，请重试</p></div>';
        });
}

function updateActiveMenu(contentType) {
    // 移除所有菜单项的活动状态
    const menuItems = document.querySelectorAll('ul.pl-10 a');
    menuItems.forEach(item => {
        item.classList.remove('bg-primary/10', 'text-primary', 'font-medium');
        item.classList.add('text-gray-600');
    });
    
    // 为当前选中的菜单项添加活动状态
    let selector = contentType === 'mypurchases' ? '我的购买' : '我的订单';
    menuItems.forEach(item => {
        if (item.textContent.trim() === selector) {
            item.classList.remove('text-gray-600');
            item.classList.add('bg-primary/10', 'text-primary', 'font-medium');
        }
    });
}
</script>
