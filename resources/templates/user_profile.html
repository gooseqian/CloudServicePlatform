<!DOCTYPE html>
<html lang='zh-CN'>
<head>
    <meta charset='utf-8'/>
    <meta content='width=device-width, initial-scale=1.0' name='viewport'/>
    <title>个人中心 - 云制造服务平台</title>
    <script src='https://res.gemcoder.com/js/reload.js'></script>
    <script src='https://cdn.tailwindcss.com'></script>
    <link href='https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css' rel='stylesheet'/>
    <script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary: '#4F46E5',
        secondary: '#1E40AF',
        accent: '#3B82F6',
        light: '#DBEAFE',
        dark: '#1E293B'
      },
      fontFamily: {
        inter: ['Inter', 'system-ui', 'sans-serif']
      }
    }
  }
};
    </script>
    <style type='text/tailwindcss'>
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .gradient-bg {
                @apply bg-gradient-to-br from-primary to-secondary;
            }
            .card-shadow {
                @apply shadow-lg hover:shadow-xl transition-shadow duration-300;
            }
            .info-label {
                @apply text-sm font-medium text-gray-700 mb-1 block;
            }
            .info-value {
                @apply text-sm text-gray-900 bg-gray-50 p-3 rounded-md border border-gray-200 min-h-[44px] flex items-center;
            }
        }
    </style>
</head>
<body class='font-inter bg-gray-50 min-h-screen'>
    <!-- [MODULE] w8x_主内容区域 -->
    <div class='min-h-screen flex flex-col'>
        <!-- [MODULE] y9z_顶部导航栏 -->
        <header class='bg-white shadow-sm z-10'>
            <div class='flex items-center justify-between px-6 py-3'>
                    <div class='flex items-center'>
                        <h2 class='text-lg font-semibold text-gray-800'>个人中心</h2>
                    </div>
                    <!-- 操作按钮区域 -->
                    <div class='flex items-center space-x-3'>
                        <button id='editButton' class='flex items-center space-x-2 px-4 py-2 bg-primary text-white rounded-md hover:bg-primary/90 transition-colors duration-200'>
                            <i class='fas fa-edit'></i>
                            <span>编辑资料</span>
                        </button>
                        <button id='saveButton' class='flex items-center space-x-2 px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 transition-colors duration-200 hidden'>
                            <i class='fas fa-save'></i>
                            <span>保存修改</span>
                        </button>
                        <button id='cancelButton' class='flex items-center space-x-2 px-4 py-2 bg-gray-600 text-white rounded-md hover:bg-gray-700 transition-colors duration-200 hidden'>
                            <i class='fas fa-times'></i>
                            <span>取消</span>
                        </button>
                    </div>
                <div class='flex items-center space-x-4'>
                    <!-- 返回首页按钮 -->
                    <button class='flex items-center space-x-2 px-4 py-2 bg-primary text-white rounded-md hover:bg-primary/90 transition-colors duration-200' onclick="window.location.href='/home'">
                        <i class='fas fa-arrow-left'></i>
                        <span>返回首页</span>
                    </button>
                    <!-- 个人中心头像 -->
                    <div class='flex items-center space-x-2 cursor-pointer group' onclick="window.location.href='/user_profile'">
                        <div class='w-9 h-9 rounded-full overflow-hidden border-2 border-primary flex items-center justify-center'>
                            <img id='navbarAvatar' src='/images/default-avatar.png' alt='用户头像' class='w-full h-full object-cover'>
                        </div>
                        <div class='hidden md:block'>
                            <p class='text-sm font-medium text-primary'>个人中心</p>
                        </div>
                    </div>
                </div>
            </div>
        </header>
        <!-- [/MODULE] y9z_顶部导航栏 -->
        <!-- [MODULE] b2c_个人中心内容 -->
        <main class='flex-1 overflow-y-auto bg-gray-50 p-6'>
            <div class='bg-white rounded-lg shadow-sm p-6 mb-6'>
                <h3 class='text-xl font-semibold text-gray-800 mb-6 flex items-center'>
                    <i class='fas fa-user-circle text-primary mr-3'></i>
                    个人基本信息
                </h3>
                
                <!-- 头像区域 -->
                <div class='flex items-center space-x-6 mb-8 pb-6 border-b border-gray-200'>
                    <div class='relative'>
                        <!-- 头像显示 -->
                        <img id='avatarImage' th:src="@{${avatarUrl}}" alt='用户头像' class='w-24 h-24 rounded-full object-cover border-4 border-primary/20 shadow-lg'>
                        <!-- 上传按钮 -->
                        <div class='absolute bottom-0 right-0'>
                            <label for='avatarUpload' class='cursor-pointer'>
                                <div class='w-10 h-10 bg-primary rounded-full flex items-center justify-center shadow-lg hover:bg-primary/90 transition-colors duration-200'>
                                    <i class='fas fa-camera text-white text-sm'></i>
                                </div>
                            </label>
                            <input type='file' id='avatarUpload' accept='image/*' class='hidden'>
                        </div>
                    </div>
                    <div class='flex-1'>
                        <h4 class='text-lg font-semibold text-gray-800 mb-2' th:text="${realName} + ' (' + ${username} + ')'">张三 (user1)</h4>
                        <p class='text-gray-600 mb-1'>点击相机图标上传新头像</p>
                        <p class='text-sm text-gray-500'>支持 JPG、PNG 格式，文件大小不超过 5MB</p>
                    </div>
                </div>
                
                <div class='grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6'>
                    <!-- 用户名 -->
                    <div>
                        <label class='info-label'>用户名</label>
                        <div class='info-value'>
                            <span th:text="${username}" class="font-medium">user1</span>
                        </div>
                    </div>
                    <!-- 邮箱 -->
                    <div>
                        <label class='info-label'>邮箱</label>
                        <div class='info-value'>
                            <span th:text="${email}">user1@example.com</span>
                        </div>
                    </div>
                    <!-- 手机号 -->
                    <div>
                        <label class='info-label'>手机号</label>
                        <div class='info-value'>
                            <span th:text="${phone}">138****1234</span>
                        </div>
                    </div>
                    <!-- 注册时间 -->
                    <div>
                        <label class='info-label'>注册时间</label>
                        <div class='info-value'>
                            <span th:text="${createdTime}">2024-01-01 10:00:00</span>
                        </div>
                    </div>
                    <!-- 用户角色 -->
                    <div>
                        <label class='info-label'>用户角色</label>
                        <div class='info-value'>
                            <span th:text="${userRole}" class="px-2 py-1 bg-primary/10 text-primary rounded-full">普通用户</span>
                        </div>
                    </div>
                    <!-- 账户状态 -->
                    <div>
                        <label class='info-label'>账户状态</label>
                        <div class='info-value'>
                            <span class="flex items-center">
                                <span class="w-2 h-2 bg-green-500 rounded-full mr-2"></span>
                                正常
                            </span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 基础资料卡片 -->
            <div class='bg-white rounded-lg shadow-sm p-6 mb-6'>
                <h3 class='text-xl font-semibold text-gray-800 mb-6 flex items-center'>
                    <i class='fas fa-id-card text-primary mr-3'></i>
                    基础资料
                </h3>
                <div class='grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6'>
                    <!-- 身份证号 -->
                    <div>
                        <label class='info-label'>身份证号</label>
                        <div class='info-value max-w-[200px]'>
                            <span id='idCardNoDisplay' th:text="${idCardNo}">110***********1234</span>
                            <input type='text' id='idCardNo' th:value="${idCardNo == '未设置' ? '' : idCardNo}" class='hidden w-full text-sm text-gray-900 bg-gray-50 p-3 rounded-md border border-gray-200 outline-none focus:ring-2 focus:ring-primary/50' placeholder='请输入身份证号'>
                        </div>
                    </div>
                    <!-- 公司名称 -->
                    <div>
                        <label class='info-label'>公司名称</label>
                        <div class='info-value'>
                            <span id='companyNameDisplay' th:text="${companyName}">示例科技有限公司</span>
                            <input type='text' id='companyName' th:value="${companyName == '未设置' ? '' : companyName}" class='hidden w-full text-sm text-gray-900 bg-gray-50 p-3 rounded-md border border-gray-200 outline-none focus:ring-2 focus:ring-primary/50' placeholder='请输入公司名称'>
                        </div>
                    </div>
                    <!-- 公司地址 -->
                    <div class='lg:col-span-3'>
                        <label class='info-label'>公司地址</label>
                        <div class='info-value min-h-[60px]'>
                            <span id='companyAddressDisplay' th:text="${companyAddress}">北京市朝阳区示例大厦</span>
                            <textarea id='companyAddress' th:text="${companyAddress == '未设置' ? '' : companyAddress}" class='hidden w-full text-sm text-gray-900 bg-gray-50 p-3 rounded-md border border-gray-200 outline-none focus:ring-2 focus:ring-primary/50 min-h-[60px]' placeholder='请输入公司地址'></textarea>
                        </div>
                    </div>
                    <!-- 营业执照号 -->
                    <div>
                        <label class='info-label'>营业执照号</label>
                        <div class='info-value'>
                            <span id='businessLicenseNoDisplay' th:text="${businessLicenseNo}">未设置</span>
                            <input type='text' id='businessLicenseNo' th:value="${businessLicenseNo == '未设置' ? '' : businessLicenseNo}" class='hidden w-full text-sm text-gray-900 bg-gray-50 p-3 rounded-md border border-gray-200 outline-none focus:ring-2 focus:ring-primary/50' placeholder='请输入营业执照号'>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 交易统计卡片 -->
            <div class='bg-white rounded-lg shadow-sm p-6 mb-6'>
                <h3 class='text-xl font-semibold text-gray-800 mb-6 flex items-center'>
                    <i class='fas fa-chart-line text-primary mr-3'></i>
                    交易统计
                </h3>
                <div class='grid grid-cols-1 md:grid-cols-3 gap-6'>
                    <!-- 总交易次数 -->
                    <div class='bg-gradient-to-r from-primary/5 to-primary/10 p-4 rounded-lg border border-primary/20'>
                        <p class='text-sm text-gray-600 mb-2'>总交易次数</p>
                        <p class='text-3xl font-bold text-primary' th:text="${totalTransactions}">0</p>
                    </div>
                    <!-- 交易成功率 -->
                    <div class='bg-gradient-to-r from-secondary/5 to-secondary/10 p-4 rounded-lg border border-secondary/20'>
                        <p class='text-sm text-gray-600 mb-2'>交易成功率</p>
                        <p class='text-3xl font-bold text-secondary' th:text="${successRate}">0.00%</p>
                    </div>
                    <!-- 平均响应时间 -->
                    <div class='bg-gradient-to-r from-accent/5 to-accent/10 p-4 rounded-lg border border-accent/20'>
                        <p class='text-sm text-gray-600 mb-2'>平均响应时间</p>
                        <p class='text-3xl font-bold text-accent' th:text="${avgResponseTime}">0秒</p>
                    </div>
                </div>
            </div>
            
            <!-- 信用和专业信息卡片 -->
            <div class='bg-white rounded-lg shadow-sm p-6 mb-6'>
                <h3 class='text-xl font-semibold text-gray-800 mb-6 flex items-center'>
                    <i class='fas fa-medal text-primary mr-3'></i>
                    信用与专业信息
                </h3>
                <div class='grid grid-cols-1 md:grid-cols-2 gap-6'>
                    <!-- 信用等级 -->
                    <div>
                        <label class='info-label'>信用等级</label>
                        <div class='info-value'>
                            <span class="px-3 py-1 bg-primary/10 text-primary rounded-full text-lg font-medium" th:text="${creditLevel}">0</span>
                        </div>
                    </div>
                    <!-- 专业领域 -->
                    <div>
                        <label class='info-label'>专业领域</label>
                        <div class='info-value'>
                            <span id='specializationDisplay' th:text="${specialization}">未设置</span>
                            <input type='text' id='specialization' th:value="${specialization == '未设置' ? '' : specialization}" class='hidden w-full text-sm text-gray-900 bg-gray-50 p-3 rounded-md border border-gray-200 outline-none focus:ring-2 focus:ring-primary/50' placeholder='请输入专业领域'>
                        </div>
                    </div>
                    <!-- 设备能力 -->
                    <div class='md:col-span-2'>
                        <label class='info-label'>设备能力</label>
                        <div class='info-value min-h-[60px]'>
                            <span id='equipmentCapabilityDisplay' th:text="${equipmentCapability}">未设置</span>
                            <textarea id='equipmentCapability' th:text="${equipmentCapability == '未设置' ? '' : equipmentCapability}" class='hidden w-full text-sm text-gray-900 bg-gray-50 p-3 rounded-md border border-gray-200 outline-none focus:ring-2 focus:ring-primary/50 min-h-[60px]' placeholder='请输入设备能力'></textarea>
                        </div>
                    </div>
                    <!-- 服务范围 -->
                    <div class='md:col-span-2'>
                        <label class='info-label'>服务范围</label>
                        <div class='info-value min-h-[60px]'>
                            <span id='serviceScopeDisplay' th:text="${serviceScope}">未设置</span>
                            <textarea id='serviceScope' th:text="${serviceScope == '未设置' ? '' : serviceScope}" class='hidden w-full text-sm text-gray-900 bg-gray-50 p-3 rounded-md border border-gray-200 outline-none focus:ring-2 focus:ring-primary/50 min-h-[60px]' placeholder='请输入服务范围'></textarea>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 认证资质卡片 -->
            <div class='bg-white rounded-lg shadow-sm p-6 mb-6'>
                <h3 class='text-xl font-semibold text-gray-800 mb-6 flex items-center'>
                    <i class='fas fa-certificate text-primary mr-3'></i>
                    认证资质
                </h3>
                <div class='info-value min-h-[100px] whitespace-pre-line'>
                    <span id='certificationsDisplay' th:text="${certifications}">未设置</span>
                    <textarea id='certifications' th:text="${certifications == '未设置' ? '' : certifications}" class='hidden w-full text-sm text-gray-900 bg-gray-50 p-3 rounded-md border border-gray-200 outline-none focus:ring-2 focus:ring-primary/50 min-h-[100px]' placeholder='请输入认证资质，每行一个'></textarea>
                </div>
            </div>
            
            <!-- 时间信息卡片 -->
            <div class='bg-white rounded-lg shadow-sm p-6'>
                <h3 class='text-xl font-semibold text-gray-800 mb-6 flex items-center'>
                    <i class='fas fa-clock text-primary mr-3'></i>
                    时间信息
                </h3>
                <div class='grid grid-cols-1 md:grid-cols-2 gap-6'>
                    <!-- 资料创建时间 -->
                    <div>
                        <label class='info-label'>资料创建时间</label>
                        <div class='info-value'>
                            <span th:text="${profileCreatedAt}">未设置</span>
                        </div>
                    </div>
                    <!-- 资料更新时间 -->
                    <div>
                        <label class='info-label'>资料更新时间</label>
                        <div class='info-value'>
                            <span th:text="${profileUpdatedAt}">未设置</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <!-- [/MODULE] b2c_个人中心内容 -->
    </div>
    <!-- [/MODULE] w8x_主内容区域 -->
    
    <!-- 消息提示框 -->
    <div id='messageBox' class='fixed top-5 right-5 max-w-sm bg-white shadow-lg rounded-lg overflow-hidden transform transition-all duration-300 scale-0 z-50'>
        <div id='messageHeader' class='px-4 py-2 bg-green-500 text-white flex items-center justify-between'>
            <h3 class='font-medium'>操作结果</h3>
            <button onclick='hideMessageBox()' class='text-white hover:text-gray-200'>
                <i class='fas fa-times'></i>
            </button>
        </div>
        <div id='messageContent' class='px-4 py-3 text-gray-700'>
            操作成功
        </div>
    </div>
    
    <script>
        // 显示消息提示
        function showMessage(message, isSuccess = true) {
            const messageBox = document.getElementById('messageBox');
            const messageHeader = document.getElementById('messageHeader');
            const messageContent = document.getElementById('messageContent');
            
            messageContent.textContent = message;
            messageHeader.className = isSuccess 
                ? 'px-4 py-2 bg-green-500 text-white flex items-center justify-between' 
                : 'px-4 py-2 bg-red-500 text-white flex items-center justify-between';
            
            messageBox.classList.remove('scale-0');
            messageBox.classList.add('scale-100');
            
            // 3秒后自动隐藏
            setTimeout(hideMessageBox, 3000);
        }
        
        // 加载用户头像
        function loadUserAvatar() {
            fetch('/api/user/avatar')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('获取头像失败');
                    }
                    return response.json();
                })
                .then(data => {
                    const navbarAvatar = document.getElementById('navbarAvatar');
                    if (navbarAvatar) {
                        // 添加时间戳防止缓存
                        navbarAvatar.src = data.avatarUrl + '?' + new Date().getTime();
                    }
                })
                .catch(error => {
                    console.error('加载头像失败:', error);
                });
        }
        
        // 页面加载完成后加载头像
        document.addEventListener('DOMContentLoaded', function() {
            loadUserAvatar();
        });
        
        // 隐藏消息提示
        function hideMessageBox() {
            const messageBox = document.getElementById('messageBox');
            messageBox.classList.remove('scale-100');
            messageBox.classList.add('scale-0');
        }
        
        // 切换到编辑模式
        document.getElementById('editButton').addEventListener('click', function() {
            // 隐藏显示元素，显示输入元素
            const displayElements = document.querySelectorAll('[id$="Display"]');
            const inputElements = document.querySelectorAll('input, textarea');
            
            displayElements.forEach(el => el.classList.add('hidden'));
            inputElements.forEach(el => {
                if (el.id !== 'editButton' && el.id !== 'saveButton' && el.id !== 'cancelButton') {
                    el.classList.remove('hidden');
                }
            });
            
            // 切换按钮显示状态
            document.getElementById('editButton').classList.add('hidden');
            document.getElementById('saveButton').classList.remove('hidden');
            document.getElementById('cancelButton').classList.remove('hidden');
        });
        
        // 取消编辑
        document.getElementById('cancelButton').addEventListener('click', function() {
            // 显示显示元素，隐藏输入元素
            const displayElements = document.querySelectorAll('[id$="Display"]');
            const inputElements = document.querySelectorAll('input, textarea');
            
            displayElements.forEach(el => el.classList.remove('hidden'));
            inputElements.forEach(el => {
                if (el.id !== 'editButton' && el.id !== 'saveButton' && el.id !== 'cancelButton') {
                    el.classList.add('hidden');
                }
            });
            
            // 切换按钮显示状态
            document.getElementById('editButton').classList.remove('hidden');
            document.getElementById('saveButton').classList.add('hidden');
            document.getElementById('cancelButton').classList.add('hidden');
        });
        
        // 保存修改
        document.getElementById('saveButton').addEventListener('click', function() {
            // 收集表单数据
            const formData = {
                idCardNo: document.getElementById('idCardNo').value.trim(),
                companyName: document.getElementById('companyName').value.trim(),
                companyAddress: document.getElementById('companyAddress').value.trim(),
                businessLicenseNo: document.getElementById('businessLicenseNo').value.trim(),
                specialization: document.getElementById('specialization').value.trim(),
                equipmentCapability: document.getElementById('equipmentCapability').value.trim(),
                serviceScope: document.getElementById('serviceScope').value.trim(),
                certifications: document.getElementById('certifications').value.trim()
            };
            
            // 发送保存请求
            fetch('/user_profile/update', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.text())
            .then(data => {
                // 显示成功消息
                showMessage('资料保存成功', true);
                
                // 刷新页面以显示更新后的数据
                setTimeout(() => {
                    window.location.reload();
                }, 1500);
            })
            .catch(error => {
                console.error('保存失败:', error);
                showMessage('保存失败，请重试', false);
            });
        });
        
        // 退出登录功能
        function logout() {
            if (confirm('确定要退出登录吗？')) {
                // 发送退出登录请求 - 使用Spring Security默认的登出路径
                fetch('/logout', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                })
                .then(response => {
                    if (response.ok) {
                        // 退出成功，跳转到登录页面
                        window.location.href = '/login?logout=true';
                    } else {
                        alert('退出登录失败，请重试');
                    }
                })
                .catch(error => {
                    console.error('退出登录错误:', error);
                    alert('退出登录失败，请重试');
                });
            }
        }
        
        // 头像上传功能
        document.getElementById('avatarUpload').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            // 验证文件类型
            if (!file.type.startsWith('image/')) {
                showMessage('只能上传图片文件', false);
                return;
            }
            
            // 验证文件大小（5MB）
            if (file.size > 5 * 1024 * 1024) {
                showMessage('文件大小不能超过5MB', false);
                return;
            }
            
            // 创建FormData对象
            const formData = new FormData();
            formData.append('avatar', file);
            
            // 显示上传中状态
            const uploadButton = document.querySelector('label[for="avatarUpload"]');
            const originalHTML = uploadButton.innerHTML;
            uploadButton.innerHTML = '<i class="fas fa-spinner fa-spin text-white text-sm"></i>';
            uploadButton.style.pointerEvents = 'none';
            
            // 发送上传请求
            fetch('/user_profile/upload_avatar', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                return Promise.all([response.ok, response.text()]);
            })
            .then(([ok, data]) => {
                if (ok) {
                    showMessage('头像上传成功', true);
                    
                    // 更新头像预览
                    const avatarImage = document.getElementById('avatarImage');
                    const timestamp = new Date().getTime();
                    avatarImage.src = avatarImage.src.split('?')[0] + '?' + timestamp;
                    
                    // 刷新页面以显示新头像
                    setTimeout(() => {
                        window.location.reload();
                    }, 1000);
                } else {
                    showMessage('上传失败: ' + data, false);
                }
            })
            .catch(error => {
                console.error('上传错误:', error);
                showMessage('上传失败，请重试', false);
            })
            .finally(() => {
                // 恢复上传按钮状态
                uploadButton.innerHTML = originalHTML;
                uploadButton.style.pointerEvents = 'auto';
                
                // 清空文件输入框
                event.target.value = '';
            });
        });
        
        // 头像预览功能
        document.getElementById('avatarUpload').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            // 创建文件预览
            const reader = new FileReader();
            reader.onload = function(e) {
                const avatarImage = document.getElementById('avatarImage');
                avatarImage.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
